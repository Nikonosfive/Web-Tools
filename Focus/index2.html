<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced OpenCV Focus Stacker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .canvas-container {
            background-image: 
                linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
                linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
                linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Spinner */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #ffffff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    
    <!-- OpenCV.js Configuration: Must be defined before loading the script -->
    <script>
        var cvReady = false;
        var Module = {
            onRuntimeInitialized: function() {
                cvReady = true;
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                console.log("OpenCV.js Initialized Successfully.");
            }
        };
    </script>
    <!-- Load OpenCV.js -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" type="text/javascript"></script>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-8">

    <!-- Loading Screen (Waiting for OpenCV Wasm to compile/load) -->
    <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 text-white">
        <div class="spinner mb-4"></div>
        <h2 class="text-xl font-semibold mb-2">Loading OpenCV Engine...</h2>
        <p class="text-slate-400 text-sm">Please wait, compiling WebAssembly module.</p>
    </div>

    <!-- Main App Content (Hidden until OpenCV loads) -->
    <main id="app-content" class="hidden max-w-6xl w-full mx-auto flex-grow flex flex-col gap-6">
        
        <header class="text-center mb-2">
            <h1 class="text-4xl font-bold text-slate-800 tracking-tight">Focus Stacker <span class="text-indigo-600 text-2xl align-top">PRO</span></h1>
            <p class="text-slate-500 mt-2 max-w-2xl mx-auto">Advanced focus stacking with auto-alignment (solves focus breathing). Powered by OpenCV.js.</p>
        </header>

        <div class="bg-white rounded-2xl shadow-lg border border-slate-100 p-6 flex flex-col gap-6">
            
            <!-- Controls -->
            <div class="flex flex-col md:flex-row gap-4 items-end bg-slate-50 p-4 rounded-xl border border-slate-200">
                <div class="flex-grow w-full">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">1. Select Sequence Images</label>
                    <input type="file" id="fileInput" multiple accept="image/*" 
                           class="block w-full text-sm text-slate-500
                                  file:mr-4 file:py-2.5 file:px-4
                                  file:rounded-md file:border-0
                                  file:text-sm file:font-semibold
                                  file:bg-indigo-100 file:text-indigo-700
                                  hover:file:bg-indigo-200 transition-colors cursor-pointer bg-white border border-slate-200 rounded-md p-1 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button id="processBtn" class="w-full md:w-auto px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-md shadow transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    Align & Stack
                </button>
            </div>

            <!-- Progress Section -->
            <div id="progressContainer" class="hidden flex flex-col gap-2 bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                <div class="flex justify-between text-sm font-semibold text-indigo-900">
                    <span id="statusText">Initializing...</span>
                    <span id="progressText">0%</span>
                </div>
                <div class="w-full bg-indigo-200 rounded-full h-3 overflow-hidden">
                    <div id="progressBar" class="bg-indigo-600 h-3 rounded-full transition-all duration-300 ease-out" style="width: 0%"></div>
                </div>
                <div id="logText" class="text-xs text-indigo-700 font-mono mt-1 h-12 overflow-y-auto"></div>
            </div>

            <!-- Output Section -->
            <div class="flex flex-col gap-3">
                <div class="flex justify-between items-center px-1">
                    <h2 class="text-lg font-bold text-slate-800">Final Result</h2>
                    <button id="downloadBtn" class="hidden px-5 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold rounded-md shadow transition-colors text-sm flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Download HD Image
                    </button>
                </div>
                
                <div class="canvas-container w-full bg-slate-100 rounded-xl border border-slate-200 overflow-hidden flex items-center justify-center min-h-[500px]">
                    <canvas id="outputCanvas" class="max-w-full h-auto object-contain drop-shadow-md"></canvas>
                    <p id="canvasPlaceholder" class="text-slate-400 font-medium">Stacked image will appear here</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal Message Box -->
    <div id="message-box" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
            <h3 id="message-title" class="text-xl font-bold text-slate-900 mb-2">Notice</h3>
            <p id="message-body" class="text-slate-600 mb-6 whitespace-pre-wrap"></p>
            <div class="flex justify-end">
                <button onclick="closeMessageBox()" class="px-6 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition-colors font-medium">OK</button>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const statusText = document.getElementById('statusText');
        const logText = document.getElementById('logText');
        const outputCanvas = document.getElementById('outputCanvas');
        const ctx = outputCanvas.getContext('2d', { willReadFrequently: true });
        const canvasPlaceholder = document.getElementById('canvasPlaceholder');
        const downloadBtn = document.getElementById('downloadBtn');

        // Message Box UI
        function showMessage(title, message) {
            document.getElementById('message-title').innerText = title;
            document.getElementById('message-body').innerText = message;
            document.getElementById('message-box').classList.remove('hidden');
        }
        function closeMessageBox() { document.getElementById('message-box').classList.add('hidden'); }

        // Utils
        const yieldThread = (ms = 0) => new Promise(resolve => setTimeout(resolve, ms));
        
        function updateProgress(percent, status, logMsg = null) {
            progressBar.style.width = `${percent}%`;
            progressText.innerText = `${Math.round(percent)}%`;
            if (status) statusText.innerText = status;
            if (logMsg) {
                logText.innerHTML += `> ${logMsg}<br>`;
                logText.scrollTop = logText.scrollHeight;
            }
        }

        // Load HTMLImageElement
        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error(`Failed to load ${file.name}`));
                img.src = URL.createObjectURL(file);
            });
        }

        // Draw image to a temporary canvas and return ImageData
        function getImageData(img, width, height) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext('2d', { willReadFrequently: true });
            context.drawImage(img, 0, 0, width, height);
            return context.getImageData(0, 0, width, height);
        }

        // -------------------------------------------------------------
        // Core Logic: OpenCV Alignment & Focus Processing
        // -------------------------------------------------------------
        processBtn.addEventListener('click', async () => {
            if (!cvReady) {
                showMessage("Hold On", "OpenCV is still loading.");
                return;
            }

            const files = fileInput.files;
            if (files.length < 2) {
                showMessage("Input Required", "Please select at least 2 images for focus stacking.");
                return;
            }

            // Lock UI
            processBtn.disabled = true;
            fileInput.disabled = true;
            downloadBtn.classList.add('hidden');
            canvasPlaceholder.classList.add('hidden');
            progressContainer.classList.remove('hidden');
            logText.innerHTML = ''; // clear logs
            outputCanvas.width = 0; outputCanvas.height = 0;

            // Arrays for JS Memory Caching (Extracted from OpenCV)
            const imageDataCache = []; // Will store Uint8Array of aligned RGB pixels
            const weightDataCache = []; // Will store Uint8Array of blurred Laplacian (focus map)
            
            // Persistent Reference Variables for Alignment
            let refMat = null;
            let refKeypoints = null;
            let refDescriptors = null;
            let orb = null;
            let matcher = null;

            try {
                // 1. Load Images
                updateProgress(2, "Loading images to memory...", `Selected ${files.length} images.`);
                await yieldThread(10);
                const images = [];
                for (let i = 0; i < files.length; i++) {
                    images.push(await loadImage(files[i]));
                }
                const width = images[0].width;
                const height = images[0].height;

                // Validate dimensions
                for (let i = 1; i < images.length; i++) {
                    if (images[i].width !== width || images[i].height !== height) {
                        throw new Error("All images must have the exact same resolution.");
                    }
                }

                // Initialize ORB and Matcher
                orb = new cv.ORB(5000, 1.2, 8, 31, 0, 2, cv.ORB_HARRIS_SCORE, 31, 20);
                matcher = new cv.BFMatcher(cv.NORM_HAMMING, true); // crossCheck=true for better matches

                // 2. Process Sequence
                for (let imgIdx = 0; imgIdx < images.length; imgIdx++) {
                    const pctStart = 5 + (imgIdx / images.length) * 70;
                    updateProgress(pctStart, `Processing image ${imgIdx + 1} of ${images.length}...`, `Reading file: ${files[imgIdx].name}`);
                    await yieldThread(10);

                    // A) Load Image into cv.Mat
                    let imgData = getImageData(images[imgIdx], width, height);
                    let srcMat = cv.matFromImageData(imgData);
                    let grayMat = new cv.Mat();
                    cv.cvtColor(srcMat, grayMat, cv.COLOR_RGBA2GRAY);

                    let alignedMat = new cv.Mat(); // Will hold the result of warpPerspective (or original if it's ref)
                    
                    // B) Alignment Logic (Feature Matching + Homography)
                    if (imgIdx === 0) {
                        // This is the Reference Image. Extract features and store them.
                        updateProgress(pctStart + 2, `Extracting reference features...`);
                        await yieldThread(10);
                        
                        refMat = srcMat.clone(); // Keep reference to calculate output size
                        refKeypoints = new cv.KeyPointVector();
                        refDescriptors = new cv.Mat();
                        
                        orb.detectAndCompute(grayMat, new cv.Mat(), refKeypoints, refDescriptors);
                        
                        srcMat.copyTo(alignedMat); // Reference image requires no warping
                        updateProgress(pctStart + 4, null, `Found ${refKeypoints.size()} keypoints in reference.`);
                    } 
                    else {
                        // Align current image to reference
                        updateProgress(pctStart + 2, `Aligning image ${imgIdx + 1}...`);
                        await yieldThread(10);

                        let imgKeypoints = new cv.KeyPointVector();
                        let imgDescriptors = new cv.Mat();
                        orb.detectAndCompute(grayMat, new cv.Mat(), imgKeypoints, imgDescriptors);

                        let matches = new cv.DMatchVector();
                        matcher.match(imgDescriptors, refDescriptors, matches);

                        // Filter matches by distance
                        let matchArray = [];
                        for (let i = 0; i < matches.size(); i++) {
                            matchArray.push(matches.get(i));
                        }
                        matchArray.sort((a, b) => a.distance - b.distance);
                        let goodMatchesCount = Math.min(500, matchArray.length); // Take best 500
                        
                        updateProgress(pctStart + 3, null, `Matched ${goodMatchesCount} features against reference.`);

                        if (goodMatchesCount >= 4) {
                            let srcPtsData = [];
                            let dstPtsData = [];
                            for (let i = 0; i < goodMatchesCount; i++) {
                                let m = matchArray[i];
                                let p1 = imgKeypoints.get(m.queryIdx).pt;
                                let p2 = refKeypoints.get(m.trainIdx).pt;
                                srcPtsData.push(p1.x, p1.y);
                                dstPtsData.push(p2.x, p2.y);
                            }
                            
                            let srcPts = cv.matFromArray(goodMatchesCount, 1, cv.CV_32FC2, srcPtsData);
                            let dstPts = cv.matFromArray(goodMatchesCount, 1, cv.CV_32FC2, dstPtsData);

                            // Find Homography (RANSAC handles outliers)
                            let M = cv.findHomography(srcPts, dstPts, cv.RANSAC, 5.0);

                            if (!M.empty()) {
                                cv.warpPerspective(srcMat, alignedMat, M, refMat.size(), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());
                                updateProgress(pctStart + 4, null, `Warp Perspective successful.`);
                            } else {
                                updateProgress(pctStart + 4, null, `[WARN] Homography empty, using unaligned.`);
                                srcMat.copyTo(alignedMat);
                            }
                            
                            // Cleanup temp points & matrices
                            srcPts.delete(); dstPts.delete(); M.delete();
                        } else {
                            updateProgress(pctStart + 4, null, `[WARN] Not enough features to align. Using original.`);
                            srcMat.copyTo(alignedMat);
                        }

                        // Cleanup current image features
                        imgKeypoints.delete(); imgDescriptors.delete(); matches.delete();
                    }

                    // C) Focus Measurement (Laplacian -> Blur) on the Aligned Image
                    updateProgress(pctStart + 5, `Measuring focus for image ${imgIdx + 1}...`);
                    await yieldThread(10);

                    let alignedGray = new cv.Mat();
                    cv.cvtColor(alignedMat, alignedGray, cv.COLOR_RGBA2GRAY);

                    // Use Laplacian to find edges (high frequencies = focus)
                    let lap = new cv.Mat();
                    cv.Laplacian(alignedGray, lap, cv.CV_64F, 3, 1, 0, cv.BORDER_DEFAULT);

                    // Convert to absolute values
                    let absLap = new cv.Mat();
                    cv.convertScaleAbs(lap, absLap, 1, 0);

                    // Gaussian Blur to smooth the focus map (creates cohesive regions)
                    let focusMap = new cv.Mat();
                    cv.GaussianBlur(absLap, focusMap, new cv.Size(31, 31), 0, 0, cv.BORDER_DEFAULT);

                    // D) Cache to standard JS Memory (Avoid OpenCV memory limits)
                    imageDataCache.push(new Uint8Array(alignedMat.data));
                    weightDataCache.push(new Uint8Array(focusMap.data));
                    
                    updateProgress(pctStart + 6, null, `Cached image ${imgIdx + 1} data.`);

                    // 🚨 STRICT MEMORY MANAGEMENT: Delete all loop mats 🚨
                    srcMat.delete();
                    grayMat.delete();
                    alignedMat.delete();
                    alignedGray.delete();
                    lap.delete();
                    absLap.delete();
                    focusMap.delete();
                }

                // E) Cleanup Reference Variables
                if (refMat) refMat.delete();
                if (refKeypoints) refKeypoints.delete();
                if (refDescriptors) refDescriptors.delete();
                if (orb) orb.delete();
                if (matcher) matcher.delete();

                // 3. Final Blending (Weighted Average using Cached Arrays)
                updateProgress(80, "Blending pixels based on focus maps...");
                logText.innerHTML += `> Starting deep pixel blend (${width}x${height})...<br>`;
                await yieldThread(50);

                const numPixels = width * height;
                const numImages = images.length;
                const finalImgData = ctx.createImageData(width, height);
                const finalData = finalImgData.data;

                // Process in async chunks to prevent UI freeze
                const CHUNK_SIZE = 150000; // Adjust for balance between speed and UI responsiveness
                
                for (let i = 0; i < numPixels; i += CHUNK_SIZE) {
                    
                    if (i % (CHUNK_SIZE * 3) === 0) {
                        let prog = 80 + ((i / numPixels) * 19);
                        updateProgress(prog, "Blending regions...", null);
                        await yieldThread(0);
                    }

                    let end = Math.min(i + CHUNK_SIZE, numPixels);
                    for (let pxIdx = i; pxIdx < end; pxIdx++) {
                        let r = 0, g = 0, b = 0;
                        let weightSum = 0;

                        // Find maximum weight for this pixel across all images
                        let maxWeight = 0;
                        for (let j = 0; j < numImages; j++) {
                            if (weightDataCache[j][pxIdx] > maxWeight) {
                                maxWeight = weightDataCache[j][pxIdx];
                            }
                        }

                        // Apply non-linear power to weights to harshly punish out-of-focus pixels
                        // while keeping boundaries soft
                        for (let j = 0; j < numImages; j++) {
                            let w = weightDataCache[j][pxIdx] / (maxWeight + 0.0001); // normalize 0-1
                            w = Math.pow(w, 8); // Power factor: Higher = sharper cuts, Lower = ghosting
                            
                            weightSum += w;
                            let dataIdx = pxIdx * 4;
                            r += imageDataCache[j][dataIdx] * w;
                            g += imageDataCache[j][dataIdx + 1] * w;
                            b += imageDataCache[j][dataIdx + 2] * w;
                        }

                        let finalIdx = pxIdx * 4;
                        finalData[finalIdx] = Math.min(255, r / weightSum);     // R
                        finalData[finalIdx + 1] = Math.min(255, g / weightSum); // G
                        finalData[finalIdx + 2] = Math.min(255, b / weightSum); // B
                        finalData[finalIdx + 3] = 255;                          // A
                    }
                }

                // 4. Render output
                updateProgress(99, "Rendering final image...", "> Drawing to canvas.");
                await yieldThread(10);
                
                outputCanvas.width = width;
                outputCanvas.height = height;
                ctx.putImageData(finalImgData, 0, 0);

                // Reveal Download Button
                downloadBtn.classList.remove('hidden');
                updateProgress(100, "Stacking Complete!", "> Processing finished successfully.");

            } catch (error) {
                console.error(error);
                showMessage("Processing Error", error.message);
                canvasPlaceholder.classList.remove('hidden');
                canvasPlaceholder.innerText = "Error occurred during processing.";
                updateProgress(0, "Failed.", `> ERROR: ${error.message}`);
            } finally {
                // Restore UI
                processBtn.disabled = false;
                fileInput.disabled = false;
            }
        });

        // Setup Download Event
        downloadBtn.addEventListener('click', () => {
            const dataURL = outputCanvas.toDataURL('image/png', 1.0);
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = `Stacked_${new Date().getTime()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
